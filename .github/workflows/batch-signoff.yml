name: Batch sign-off

# Collects every pull request waiting for sign-off, builds one report covering
# all of them, and asks for ONE approval. On approval each pull request's
# manager-signoff status flips to success and they all become mergeable together.
#
# Runs weekly, or on demand. There is no per-pull-request notification: the
# reviewer hears from this repository once a cycle rather than once a change.
#
# The report goes to the run summary, which GitHub renders directly above the
# Approve button — deliberately NOT to GitHub Pages. A Pages deployment replaces
# the whole site, and a repository only gets one, so publishing reports there
# would destroy any project site the repository already serves.
#
# collect is a separate job from signoff on purpose — an environment gate pauses
# a job before its first step, so a report built inside the gated job could not
# be read until after approving it.

on:
  schedule:
    # 14:00 UTC every Monday.
    - cron: '0 14 * * MON'
  workflow_dispatch:

permissions: {}

concurrency:
  # Never ask for two batch approvals at once; their scopes would overlap.
  group: batch-signoff
  cancel-in-progress: false

jobs:
  collect:
    name: Build the sign-off report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      statuses: read
    outputs:
      pr_count: ${{ steps.collect.outputs.pr_count }}
      pr_shas: ${{ steps.collect.outputs.pr_shas }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the pull requests awaiting sign-off
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/collect_prs.py \
            --repo "${{ github.repository }}" \
            --base "${{ github.event.repository.default_branch }}" \
            --queued \
            --out build/prs.json \
            --prompt-out build/prompt.txt \
            --github-output "$GITHUB_OUTPUT"

      - name: Render the report
        run: |
          python3 scripts/render_report.py \
            --data build/prs.json \
            --markdown-out build/summary.md \
            --html-out build/report.html \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Publish the report to the run summary
        run: cat build/summary.md >> "$GITHUB_STEP_SUMMARY"

      # The rendered HTML rides along here for anyone who wants a standalone
      # copy. It is not hosted; see the note at the top of this file.
      - name: Keep the report and raw data as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: batch-signoff-report
          path: build/
          retention-days: 90

  signoff:
    name: Manager sign-off
    needs: collect
    # Nothing queued means nothing to approve; do not wake the reviewer.
    if: needs.collect.outputs.pr_count != '0'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    # The gate. One approval, covering every pull request in the report above.
    environment:
      name: external-signoff
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Release the approved pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHAS: ${{ needs.collect.outputs.pr_shas }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          released=0
          skipped=0
          for entry in ${PR_SHAS//,/ }; do
            pr="${entry%%:*}"
            reviewed="${entry##*:}"
            # Re-read the head SHA rather than trusting the collected one: if
            # the author pushed during the review, the approval must not
            # silently apply to code nobody looked at.
            # --repo is required: this job has no checkout, so gh cannot
            # infer the repository from a working directory.
            current="$(gh pr view "$pr" --repo "${{ github.repository }}" \
              --json headRefOid --jq .headRefOid)"
            if [ "$current" != "$reviewed" ]; then
              echo "::warning::PR #$pr moved from $reviewed to $current during review; leaving it queued."
              skipped=$((skipped + 1))
              continue
            fi

            gh api -X POST "repos/${{ github.repository }}/statuses/$reviewed" \
              -f state=success \
              -f context=manager-signoff \
              -f description="Approved in batch sign-off" \
              -f target_url="$RUN_URL" --silent
            released=$((released + 1))
            echo "released PR #$pr at $reviewed"
          done

          {
            echo "# Sign-off recorded"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Pull requests reviewed | ${{ needs.collect.outputs.pr_count }} |"
            echo "| Released to merge | $released |"
            echo "| Held back (changed during review) | $skipped |"
            echo "| Approved at | $(date -u '+%Y-%m-%d %H:%M UTC') |"
          } >> "$GITHUB_STEP_SUMMARY"
