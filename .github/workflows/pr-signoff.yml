name: PR sign-off

# Requests a sign-off deployment for a single pull request. Paired with the
# branch rule "Require deployments to succeed before merging" on external-signoff,
# this is a hard gate: the pull request cannot merge until a required reviewer
# approves the deployment.
#
# As with the weekly batch, the report is built in a job of its own, because an
# environment gate pauses a job before its first step runs.
#
# This one deliberately does NOT publish to Pages — the weekly batch owns that
# site, and a per-PR deploy would overwrite it. The report goes to the run
# summary, which is the page the reviewer lands on to approve anyway.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  # One pending sign-off per pull request; a new push replaces the old request.
  group: pr-signoff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    name: Build the change report
    # A draft is not asking for sign-off yet.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4

      - name: Collect this pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/collect_prs.py \
            --repo "${{ github.repository }}" \
            --base "${{ github.event.pull_request.base.ref }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --out build/prs.json \
            --prompt-out build/prompt.txt

      - name: Render the report
        run: |
          python3 scripts/render_report.py \
            --data build/prs.json \
            --markdown-out build/summary.md \
            --html-out build/report.html \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Publish the report to the run summary
        run: cat build/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-signoff
          path: build/
          retention-days: 90

  signoff:
    name: Manager sign-off
    needs: report
    runs-on: ubuntu-latest
    permissions: {}
    # The gate. Until a required reviewer approves, this job does not start, no
    # deployment succeeds, and the branch rule keeps the pull request unmergeable.
    environment:
      name: external-signoff
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Record the sign-off
        run: |
          {
            echo "# Sign-off recorded"
            echo
            echo "PR #${{ github.event.pull_request.number }} is released to merge."
            echo
            echo "Approved at $(date -u '+%Y-%m-%d %H:%M UTC')."
          } >> "$GITHUB_STEP_SUMMARY"
